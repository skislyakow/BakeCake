name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-secret-key-for-github-actions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Django checks
        working-directory: backend
        run: |
          uv run --locked python manage.py check
          uv run --locked python manage.py makemigrations --check --dry-run --noinput

      - name: Pytest
        working-directory: backend
        run: uv run --locked python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          for file in backend/static/js/*.js scripts/*.js; do
            node --check "$file"
          done

      - name: Frontend logic tests
        run: node scripts/test_frontend.js

      - name: Pyright
        run: uv run --locked pyright
