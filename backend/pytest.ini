[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = .
testpaths = apps
addopts = -ra
env =
    SECRET_KEY=test-secret-key-for-pytest
    DEBUG=true
    ALLOWED_HOSTS=localhost,127.0.0.1
    SITE_URL=http://testserver
    DELIVERY_FROM=10:00
    DELIVERY_TO=23:00
    LEAD_TIME_HOURS=24
    RUSH_SURCHARGE_PERCENT=20
    INSCRIPTION_PRICE=500
    PD_VERSION=1.0
