{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
  {{ block.super }}
  {% if change and original %}
    <div class="submit-row">
      {% if original.status == "new" %}
        <input type="submit" name="_mark_paid" value="Отметить оплаченным" class="default">
      {% elif original.status == "paid" %}
        <input type="submit" name="_mark_delivered" value="Отметить выполненным" class="default">
      {% endif %}
    </div>
  {% endif %}
{% endblock %}
