{% load static %}
<header class="navbar navbar-expand-xl navbar-light fixed-top bg-white py-4">
	<nav class="container">
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<a class="navbar-brand" href="{% url 'home' %}">
			<img src="{% static 'img/Logo.svg' %}" alt="CakeBake">
		</a>
		<div class="collapse navbar-collapse justify-content-end" id="navbar">
			<ul class="navbar-nav">
				<li class="nav-item me-5">
					<a class="nav-link fw-lighter cake_blue" href="{% url 'home' %}#step3">Создать торт</a>
				</li>
				<li class="nav-item me-5">
					<a class="nav-link fw-lighter cake_blue" href="{% url 'home' %}#step2">Каталог</a>
				</li>
				<li class="nav-item me-5">
					<a class="nav-link fw-lighter cake_blue" href="{% url 'home' %}#step4">Оплата и доставка</a>
				</li>
				<li class="nav-item me-5">
					<a class="nav-link fw-lighter cake_blue" href="{% url 'home' %}#Contacts">Контакты</a>
				</li>
				<li class="nav-item d-block d-xl-flex flex-column align-items-end me-5">
					<small class="fw-lighter text-decoration-none fs_12 cake_blue">8 (495) 000-00-00</small>
					<small class="fw-lighter text-decoration-none fs_12 cake_blue">Пн - Вс 10:00—20:00</small>
				</li>
				<li class="nav-item d-flex align-items-center">
					<a class="nav-link fw-lighter me-1 cake_blue position-relative" href="{% url 'orders' %}">
						<img src="{% static 'img/shopping-cart.svg' %}" alt="">
						<!--метка на иконке, убрать класс d-none чтоб появилась-->
						<span id="cart-badge" class="position-absolute translate-middle badge rounded-pill cake__bg_pink fs_8 d-none">0</span>
					</a>
					<a class="nav-link fw-lighter me-1 cake_blue position-relative" {% if user.is_authenticated %}href="/lk/"{% else %}href="#RegModal" data-bs-toggle="modal"{% endif %}>
						<img src="{% static 'img/user.svg' %}" alt="">
						<!--метка на иконке, убрать класс d-none чтоб появилась-->
						<span class="position-absolute translate-middle badge rounded-pill cake__bg_pink fs_8 d-none">1</span>
					</a>
<a class="nav-link fw-lighter cake_grey fs_12{% if not user.is_authenticated %} d-none{% endif %}" href="/lk/">
					{% if user.is_authenticated %}{{ user.name|default:user.phone }}{% endif %}
				</a>
				<a class="nav-link fw-lighter cake_pink fs_12{% if not user.is_authenticated %} d-none{% endif %}" href="#" onclick="BCLogout(event)">Выйти</a>
				</li>
			</ul>
		</div>
	</nav>

</header>

<script>
async function BCLogout(event) {
    event.preventDefault();
    const data = await api('/api/auth/logout/', 'POST');
    if (data.ok) window.location.reload();
}

async function BCCartBadge() {
    try {
        const data = await api('/api/orders/');
        if (!data.ok) return;
        const badge = document.getElementById('cart-badge');
        if (!badge || !data.items || !data.items.length) return;
        badge.textContent = data.items.length;
        badge.classList.remove('d-none');
    } catch (e) {}
}
{% if user.is_authenticated %}
document.addEventListener('DOMContentLoaded', BCCartBadge);
{% endif %}
</script>
